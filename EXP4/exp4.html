<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking form</title>
</head>
<body>
    <form method="post" action="#">
        <h1>Hotel Room Booking Form</h1>
        <label for = "fn">Full Name:</label> </label>
        <input type = "text" id="fn"> <br> <br>
        <label for= "email">Email:</label>
        <input type ="email" id="email"> <br> <br>
        <label for = "phone">Phone:</label>
        <input type = "number" id = "phone"> <br> <br>
        <label for ="check in date">Check In Date</label>
        <input type = "date" id = "check in date"> <br> <br>
        <label for = "check out date">Check Out Date</label>
        <input type = "date" id = "check out date"> <br> <br>
        <label type = "room type">Room Type</label>
        <select>
          <option>Single Room</option>
         <option>Double Room</option>
         <option>Deluxe Room</option>
         <option>Suite Room</option>
        </select> <br> <br>
        <label for = no. of guest>Number Of Guest</label>
         <input type =  "number" id = "no. of guest"> <br> <br>
          <label>Special Requests:</label><br>
          <textarea rows="5" cols="40"></textarea> <br><br>

          <input type="submit" value="Book Now">
          <input type="reset" value="Reset Form">

  
</form>
</body>
</html>
