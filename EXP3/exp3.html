<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Timetable<</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        caption {
            font-weight: bold;
            padding: 10px;
        }
    </style>

</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0">
    <caption>College Timetable - CSE Department</caption>
    <tr>
        <th>Day / Time</th>
        <th>9:00 - 10:00</th>
        <th>10:00 - 11:00</th>
        <th>11:00 - 12:00</th>
        <th>12:00 - 1:00</th>
        <th>1:00 - 2:00</th>
        <th>2:00 - 3:00</th>
        <th>3:00 - 4:00</th>
    </tr>





    
</body>
</html>
