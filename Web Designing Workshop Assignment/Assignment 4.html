<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic And Non-Semantic Elements</title>
        <style>
        body{
            font-family: "Times New Roman", serif;
            margin: 20px;
        }

        .container{
            width: 650px;
            margin: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }

        header h1{
            margin-bottom: 15px;
        }

        nav{
            margin-bottom: 20px;
        }

        article h2{
            margin-bottom: 10px;
        }

        footer{
            margin-top: 15px;
        }
    </style>

</head>
<body>
        <div class="container">

        <header>
            <h1>College Portal</h1>
        </header>
        <nav>
            <a href="#">Home</a> |
            <a href="#">Courses</a>
        </nav>
        <main>
            <article>
                <h2>Admission Open</h2>
                <p>Apply before 30 June.</p>
            </article>
        </main>



    </div>



    
</body>

</html>
