<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested and Responsive Tables</title>
        <style>
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>
   <div class="table-container">
<table border="1" cellspacing="0" cellpadding="8">
    <tr>
        <th>Day</th>
        <th>Lab Batches</th>
        <th>Faculty</th>
        <th>Room</th>
        <th>Time</th>
    </tr>
 
</body>
</html>
