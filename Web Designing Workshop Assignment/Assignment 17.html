<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
    <body style="background-color:#242424; color:white; font-family:Arial;">

<div style="background:white; color:black; width:680px; padding:13px; margin:20px 53px;">

    <input type="text" placeholder="Full name" required>
    <br><br>
 <input type="email" placeholder="you@college.edu" required>
    <br><br>

    <input type="text" placeholder="10-digit mobile"
           pattern="[0-9]{10}" title="Enter exactly 10 digits" required>
    <br><br>

 <input type="password" placeholder="Min 6 characters"
           minlength="6" required>
    <br><br>

    <input type="number" placeholder="Age (17)" min="17" max="30" value="17" required>
    <br><br>

 <button type="submit">Register</button>

</div>
</body>
</body>
</html>
