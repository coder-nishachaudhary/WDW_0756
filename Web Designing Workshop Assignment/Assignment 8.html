<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks and Images with Attributes</title>
</head>
<body>
    <h3 id="top">Links demo</h3>

    <!-- External Link -->
    <a href="https://www.google.com" target="_blank">
        External link
    </a>
    <br>

    <!-- Internal Link -->
    <a href="#bottom">Jump to bottom</a>
    <br>
    <!-- Email Link -->
    <a href="mailto:example@gmail.com">
        Email us
    </a>
    <br>

    <!-- Image Link -->
    <a href="https://www.google.com">
        <img src="logo.png" alt="Logo" width="60">
    </a>
<div style="margin-top:300px;" id="bottom">
Bottom.
<a href="#top">Back to top</a>
</div>
</body>
</html>
